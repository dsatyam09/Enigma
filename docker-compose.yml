services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: leaderboard
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=20
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d leaderboard"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  skiplist:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "skiplist_service.py"]
    restart: unless-stopped
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://app:${DB_PASSWORD}@db:5432/leaderboard"
      SKIPLIST_URL: "http://skiplist:8001"
    depends_on:
      db:
        condition: service_healthy
      skiplist:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
